# enables true color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# Prevent resizing of screen in multiple connected session
setw -g aggressive-resize on

# Enable mouse
set -g mouse on

# remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Basic behaviors
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g focus-events on
set-option -g history-limit 5000

# Pane switching
bind -r h select-pane -L 
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Press y in copy-mode to copy buffet to Mac clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy" \; display "Copied to system clipboard!"

# force a reload of the config file
# Not using this much anymore
# bind r source-file ~/.tmux.conf \; display "Tmux Config Reloaded!"

# Restart a pane
# Useful when the pane is dead
bind -r r respawn-pane -k

# Resizing pane
bind -r H resize-pane -L 5 
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status Bar 
set-option -g status-position top
set -g status-left-length 100
set -g status-left "#S > "
set -g status-right '#(~/Workspace/dotfiles/bin/tmux_battery_charge_indicator.zsh)| %H:%M %d-%b-%Y'
setw -g monitor-activity on 
set -g visual-activity on

# COLOUR (Modus Operandi values, https://protesilaos.com/emacs/modus-themes-colors)
set-option -g status-style "fg=#595959,bg=#f2f2f2"
set-window-option -g window-status-style "fg=#595959,bg=default,dim"
set-window-option -g window-status-current-style "fg=#0031a9,bright,bg=default"
set-option -g message-style "bg=#f2f2f2,fg=#972500,bright"
set-window-option -g clock-mode-colour "#006800"

# Panes
set-option -g display-panes-active-colour "#0031a9"
set-option -g display-panes-colour "#972500"
set-option -g pane-border-style "fg=#9f9f9f"
set-option -g pane-active-border-style "fg=#3b3b3b"
set-option -g pane-border-format "#{pane_index} #{pane_title}"
